<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Get Paid</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:18px 14px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:28px}.muted{color:#697386;font-size:13px}.lang,.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:750}.lang{background:white;border:1px solid #ddd}.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.box,.card{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:15px}.box b{display:block;font-size:22px;margin-top:5px}.card{margin:10px 0}.top{display:flex;justify-content:space-between;gap:8px}.name{font-size:18px;font-weight:800}.badge{font-size:12px;background:#f2f4f7;padding:5px 8px;border-radius:20px}.bad{color:#b42318;background:#fef3f2}.amt{font-size:25px;font-weight:850;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.primary{background:#111827;color:#fff}.secondary{background:#eef0f3}.fab{position:fixed;right:20px;bottom:25px;border:0;border-radius:30px;background:#111827;color:#fff;padding:15px 19px;font-weight:800;font-size:16px}dialog{border:0;border-radius:22px;width:min(92vw,480px);padding:0}dialog::backdrop{background:#0007}.modal{padding:20px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}.field textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modalActions{display:flex;gap:8px}.modalActions>*{flex:1}.empty{text-align:center;color:#697386;padding:45px 10px}</style></head>
<body><main class="app"><header><div><h1>Get Paid</h1><div class="muted" id="sub"></div></div><button class="lang" id="lang">EN</button></header>
<section class="sum"><div class="box"><span id="owedL"></span><b id="owed">$0</b></div><div class="box"><span id="lateL"></span><b id="late">0</b></div></section><div id="list"></div>
<button class="fab" id="add">＋ <span id="addL"></span></button></main>
<dialog id="newD"><form class="modal"><h2 id="newTitle"></h2><div class="field"><label id="clientL"></label><input id="client" required></div><div class="field"><label id="jobL"></label><input id="job"></div><div class="row"><div class="field"><label id="amountL"></label><input id="amount" type="number" min="0" step=".01"></div><div class="field"><label id="currencyL"></label><select id="currency"><option>USD</option><option>TWD</option><option>EUR</option><option>GBP</option><option>AUD</option><option>CAD</option></select></div></div><div class="field"><label id="dueL"></label><input id="due" type="date"></div><div class="field"><label id="infoL"></label><textarea id="info" placeholder="Bank / PayPal / Wise / payment link"></textarea></div><div class="modalActions"><button type="button" class="btn secondary" id="cancel"></button><button type="button" class="btn primary" id="save"></button></div></form></dialog>
<dialog id="payD"><div class="modal"><h2 id="payTitle"></h2><div class="field"><input id="payAmt" type="number" min="0" step=".01"></div><div class="modalActions"><button class="btn secondary" id="payCancel"></button><button class="btn primary" id="paySave"></button></div></div></dialog>
<dialog id="remD"><div class="modal"><h2 id="remTitle"></h2><div class="field"><textarea id="remText"></textarea></div><div class="modalActions"><button class="btn secondary" id="remClose"></button><button class="btn primary" id="copy"></button></div></div></dialog>
<script>
const T={zh:{sub:"收款追蹤助手",owed:"尚未收款",late:"已逾期",add:"新增應收",client:"客戶名稱",job:"工作／案件",amount:"應收金額",currency:"幣別",due:"付款期限",info:"付款資料",save:"儲存",cancel:"取消",receive:"收到款項",remind:"提醒付款",remaining:"尚欠",received:"已收",paid:"已付清",today:"今天到期",days:"逾期 {n} 天",future:"{n} 天後到期",nodue:"未設定期限",empty:"目前還沒有應收款",copy:"複製訊息",close:"關閉",copied:"已複製"},en:{sub:"Payment follow-up assistant",owed:"Still owed",late:"Overdue",add:"Add receivable",client:"Client",job:"Job / project",amount:"Amount due",currency:"Currency",due:"Due date",info:"Payment details",save:"Save",cancel:"Cancel",receive:"Add payment",remind:"Send reminder",remaining:"Still owed",received:"Received",paid:"Paid",today:"Due today",days:"{n} days overdue",future:"Due in {n} days",nodue:"No due date",empty:"No open receivables",copy:"Copy message",close:"Close",copied:"Copied"}};
let lang=localStorage.gpLang||"zh",data=JSON.parse(localStorage.gpData||"[]"),active=null;
const $=id=>document.getElementById(id), tr=k=>T[lang][k], persist=()=>localStorage.gpData=JSON.stringify(data), left=x=>Math.max(0,+x.amount-(+x.received||0));
function money(n,c){try{return new Intl.NumberFormat(lang==="zh"?"zh-TW":"en-US",{style:"currency",currency:c}).format(n)}catch{return c+" "+n}}
function state(x){if(left(x)<=0)return[tr("paid"),""];if(!x.due)return[tr("nodue"),""];let a=new Date();a.setHours(0,0,0,0);let d=new Date(x.due+"T00:00:00"),n=Math.round((d-a)/864e5);return n<0?[tr("days").replace("{n}",-n),"bad"]:n===0?[tr("today"),"bad"]:[tr("future").replace("{n}",n),""]}
function render(){sub.textContent=tr("sub");lang==="zh"?(langBtn="EN"):(langBtn="中文");$("lang").textContent=langBtn;owedL.textContent=tr("owed");lateL.textContent=tr("late");addL.textContent=tr("add");clientL.textContent=tr("client");jobL.textContent=tr("job");amountL.textContent=tr("amount");currencyL.textContent=tr("currency");dueL.textContent=tr("due");infoL.textContent=tr("info");newTitle.textContent=tr("add");cancel.textContent=tr("cancel");save.textContent=tr("save");payTitle.textContent=tr("receive");payCancel.textContent=tr("cancel");paySave.textContent=tr("save");remTitle.textContent=tr("remind");remClose.textContent=tr("close");copy.textContent=tr("copy");
let open=data.filter(x=>left(x)>0),lateN=open.filter(x=>x.due&&new Date(x.due+"T00:00:00")<new Date(new Date().setHours(0,0,0,0))).length;owed.textContent=money(open.filter(x=>x.currency==="USD").reduce((s,x)=>s+left(x),0),"USD")+(open.some(x=>x.currency!=="USD")?" +":"");late.textContent=lateN;
list.innerHTML=open.length?open.map(x=>{let s=state(x);return `<div class="card"><div class="top"><div><div class="name">${esc(x.client)}</div><div class="muted">${esc(x.job||"")}</div></div><span class="badge ${s[1]}">${s[0]}</span></div><div class="amt">${money(left(x),x.currency)}</div><div class="muted">${tr("received")}: ${money(x.received||0,x.currency)} · ${tr("remaining")}: ${money(left(x),x.currency)}</div><div class="actions"><button class="btn secondary" onclick="pay('${x.id}')">💰 ${tr("receive")}</button><button class="btn primary" onclick="rem('${x.id}')">💬 ${tr("remind")}</button></div></div>`}).join(""):`<div class="empty">${tr("empty")}</div>`}
function esc(s){return String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
$("lang").onclick=()=>{lang=lang==="zh"?"en":"zh";localStorage.gpLang=lang;render()};$("add").onclick=()=>{$("client").value=$("job").value=$("amount").value=$("due").value=$("info").value="";$("currency").value="USD";newD.showModal()};$("cancel").onclick=()=>newD.close();
$("save").onclick=()=>{if(!$("client").value.trim()||!+$("amount").value)return;data.unshift({id:Date.now()+"",client:$("client").value.trim(),job:$("job").value.trim(),amount:+$("amount").value,currency:$("currency").value,due:$("due").value,info:$("info").value.trim(),received:0});persist();newD.close();render()};
window.pay=id=>{active=id;payAmt.value="";payD.showModal()};payCancel.onclick=()=>payD.close();paySave.onclick=()=>{let x=data.find(x=>x.id===active),v=+payAmt.value;if(!x||v<=0)return;x.received=Math.min(+x.amount,(+x.received||0)+v);persist();payD.close();render()};
window.rem=id=>{active=id;let x=data.find(x=>x.id===id),bal=money(left(x),x.currency);remText.value=lang==="zh"?`您好 ${x.client}，提醒您目前尚有 ${bal} 款項未支付${x.due?`，付款期限為 ${x.due}`:""}。${x.info?`\n\n付款資訊：\n${x.info}`:""}\n\n謝謝！`:`Hi ${x.client}, this is a friendly reminder that ${bal} is still outstanding${x.due?`. The due date is ${x.due}`:""}.${x.info?`\n\nPayment details:\n${x.info}`:""}\n\nThank you!`;remD.showModal()};remClose.onclick=()=>remD.close();copy.onclick=async()=>{await navigator.clipboard.writeText(remText.value);copy.textContent="✓ "+tr("copied")};render();
</script></body></html>
